<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog crédit & finance — TauxNet</title>
<meta name="description" content="Guides pratiques, études et conseils sur le crédit immobilier, rachat de crédit, prêt conso et travaux. Articles rédigés par nos experts finance.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://tauxnet.fr/blog">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#091525;--gold:#c9a84c;--gold2:#e8c97a;--cream:#f6f1e9;--cream2:#ede6d8;--white:#fff;--slate:#7a8a9e;--teal:#0f6b5e;--teal3:#e0f4f1;--r:10px;--r-lg:16px}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--navy);overflow-x:hidden}
nav{background:var(--navy);padding:0 24px;position:sticky;top:0;z-index:100}
.nav-inner{max-width:1000px;margin:0 auto;height:54px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:'Fraunces',serif;font-weight:600;font-size:20px;color:var(--white);text-decoration:none}
.logo span{color:var(--gold2)}
.nav-links{display:flex;gap:4px}
.nav-links a{color:#a8b5c4;font-size:13px;font-weight:500;text-decoration:none;padding:6px 10px;border-radius:7px;transition:.15s}
.nav-links a:hover{color:var(--white);background:rgba(255,255,255,.08)}
.nav-cta{background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;padding:7px 14px;border-radius:7px;text-decoration:none}
.hero{background:var(--navy);padding:48px 24px 56px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:32px;background:var(--cream);border-radius:32px 32px 0 0}
.hero-inner{max-width:1000px;margin:0 auto;position:relative;z-index:1}
.hero-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--gold);margin-bottom:10px}
.hero-h1{font-family:'Fraunces',serif;font-weight:300;font-size:38px;color:var(--white);margin-bottom:10px}
.hero-h1 em{font-style:italic;color:var(--gold2)}
.hero-sub{font-size:15px;color:#a8b5c4;max-width:520px;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:36px 24px 64px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}
.f-btn{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--cream2);background:var(--white);color:var(--slate);transition:.15s;font-family:'DM Sans',sans-serif}
.f-btn.on{background:var(--navy);color:var(--white);border-color:var(--navy)}
.f-btn:hover:not(.on){border-color:var(--navy);color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--white);border-radius:var(--r-lg);overflow:hidden;border:1.5px solid transparent;transition:.2s;cursor:pointer;text-decoration:none;display:block;box-shadow:0 1px 4px rgba(9,21,37,.06)}
.card:hover{border-color:rgba(9,21,37,.15);transform:translateY(-3px);box-shadow:0 8px 24px rgba(9,21,37,.1)}
.card-top{height:8px;background:linear-gradient(90deg,var(--navy),#132240)}
.card-body{padding:18px}
.card-cat{font-size:10px;font-weight:700;padding:3px 9px;border-radius:5px;display:inline-block;margin-bottom:10px}
.card-h{font-family:'Fraunces',serif;font-weight:400;font-size:16px;line-height:1.35;color:var(--navy);margin-bottom:8px}
.card-excerpt{font-size:12px;color:var(--slate);line-height:1.5;margin-bottom:12px}
.card-foot{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--slate);border-top:0.5px solid var(--cream2);padding-top:10px}
.card-foot span:last-child{color:var(--teal);font-weight:600}
.card.featured{grid-column:span 2}
.card.featured .card-top{height:12px}
.card.featured .card-h{font-size:20px}
.soon{opacity:.6;cursor:default}
.soon:hover{transform:none;border-color:transparent}
.soon .card-foot span:last-child{color:var(--slate)}
footer{background:var(--navy);padding:22px;text-align:center}
footer p{font-size:12px;color:var(--slate);line-height:1.6}
footer a{color:var(--gold);text-decoration:none}
@media(max-width:700px){.grid{grid-template-columns:1fr}.card.featured{grid-column:auto}.hero-h1{font-size:26px}.nav-links{display:none}}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/" class="logo">Taux<span>Net</span></a>
    <div class="nav-links">
      <a href="/">Accueil</a>
      <a href="/#offers">Comparer</a>
      <a href="/#quiz">Quiz</a>
      <a href="/blog" style="color:var(--white)">Blog</a>
    </div>
    <a href="/#offers" class="nav-cta">Simulation gratuite →</a>
  </div>
</nav>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-label">Blog & Guides pratiques</div>
    <h1 class="hero-h1">Guides, <em>études</em> & conseils crédit</h1>
    <p class="hero-sub">Contenus rédigés par nos experts finance — 3 articles publiés chaque semaine. Données vérifiées, taux mis à jour en temps réel.</p>
  </div>
</div>

<div class="wrap">
  <div class="filters">
    <button class="f-btn on" onclick="filter(this,'all')">Tous</button>
    <button class="f-btn" onclick="filter(this,'rachat')">Rachat de crédit</button>
    <button class="f-btn" onclick="filter(this,'immo')">Immobilier</button>
    <button class="f-btn" onclick="filter(this,'profil')">Profils difficiles</button>
    <button class="f-btn" onclick="filter(this,'travaux')">Travaux & Auto</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<footer>
  <p>© 2025 TauxNet · <a href="/">Accueil</a> · <a href="/#offers">Comparer</a> · <a href="/mentions-legales">Mentions légales</a></p>
</footer>

<script>
const ARTICLES = [
  {cat:'profil',tag:'🔴 Profil difficile',tagBg:'#fdf0f0',tagColor:'#7a1a1a',
   title:'Rachat de crédit avec fichage FICP : quels organismes acceptent en 2025 ?',
   excerpt:'Être fiché FICP n\'est pas une fatalité. Découvrez les organismes qui traitent ces dossiers, les conditions et notre comparatif exclusif.',
   date:'15 mai 2025',read:'9 min',url:'/blog/rachat-credit-ficp',featured:true,live:true},
  {cat:'immo',tag:'🏠 Immobilier',tagBg:'#f0f4ff',tagColor:'#0a2060',
   title:'Crédit immobilier avec CDD : est-ce vraiment possible en 2025 ? 🏆',
   excerpt:'Les banques classiques refusent souvent les CDD pour un prêt immo. Pourtant, des solutions existent si vous connaissez les bons organismes.',
   date:'12 mai 2025',read:'11 min',url:'/blog/credit-immobilier-cdd',featured:false,live:true},
  {cat:'rachat',tag:'🔄 Rachat',tagBg:'#e0f4f1',tagColor:'#0f6b5e',
   title:'Regroupement crédit immobilier et conso : simulation complète pas à pas',
   excerpt:'Vous avez un prêt immo et des crédits conso ? Le regroupement peut réduire vos mensualités de 30 à 50%. Voici comment ça marche.',
   date:'10 mai 2025',read:'11 min',url:'/blog/regroupement-credit-immo-conso',featured:false,live:false},
  {cat:'travaux',tag:'🔨 Travaux',tagBg:'#fff8e6',tagColor:'#7a5a00',
   title:'Meilleur taux prêt travaux sans garantie — comparatif & simulation 2025',
   excerpt:'Ni hypothèque ni caution exigée. Voici les offres les plus compétitives pour financer vos travaux sans garantie réelle.',
   date:'8 mai 2025',read:'7 min',url:'/blog/pret-travaux-sans-garantie',featured:false,live:false},
  {cat:'profil',tag:'🏢 Indépendants',tagBg:'#fff4f0',tagColor:'#7a2a0a',
   title:'Prêt personnel indépendant / auto-entrepreneur : convaincre les banques',
   excerpt:'TNS, gérant, freelance — les établissements exigent 3 bilans minimum. Voici les dossiers béton qui passent.',
   date:'5 mai 2025',read:'9 min',url:'/blog/credit-independant-tns',featured:false,live:false},
  {cat:'rachat',tag:'🔄 Rachat',tagBg:'#e0f4f1',tagColor:'#0f6b5e',
   title:'Cofidis vs Younited Credit : lequel choisir pour un rachat de crédit ?',
   excerpt:'Deux géants du rachat, deux approches très différentes. On compare taux, délais, profils acceptés et conditions réelles.',
   date:'2 mai 2025',read:'8 min',url:'/blog/cofidis-vs-younited',featured:false,live:false},
  {cat:'profil',tag:'🔴 Profil difficile',tagBg:'#fdf0f0',tagColor:'#7a1a1a',
   title:'Interdit bancaire FCC : peut-on encore obtenir un crédit ? Solutions 2025',
   excerpt:'Fichage FCC levé ou en cours — quelles solutions de financement restent accessibles ? Nos experts décryptent les options.',
   date:'28 avr. 2025',read:'8 min',url:'/blog/interdit-bancaire-fcc',featured:false,live:false},
  {cat:'travaux',tag:'🚘 Auto',tagBg:'#f0f9f4',tagColor:'#1a5e38',
   title:'Crédit auto sans apport, réponse immédiate : les 5 meilleures offres',
   excerpt:'Financer une voiture sans mise de fonds initiale est possible. On compare Cetelem Auto, CA Auto Bank et Sofinco sur les vrais critères.',
   date:'25 avr. 2025',read:'6 min',url:'/blog/credit-auto-sans-apport',featured:false,live:false},
];

let currentFilter = 'all';

function render(f) {
  const list = ARTICLES.filter(a => f==='all' || a.cat===f);
  document.getElementById('grid').innerHTML = list.map((a,i) => {
    const featured = a.featured && f==='all' ? 'featured' : '';
    const soon = !a.live ? 'soon' : '';
    const click = a.live ? `href="${a.url}"` : '';
    const lbl = a.live ? 'Lire →' : 'Bientôt →';
    return `<a ${click} class="card ${featured} ${soon}">
      <div class="card-top"></div>
      <div class="card-body">
        <span class="card-cat" style="background:${a.tagBg};color:${a.tagColor}">${a.tag}</span>
        <div class="card-h">${a.title}</div>
        <div class="card-excerpt">${a.excerpt}</div>
        <div class="card-foot"><span>${a.date} · ${a.read} de lecture</span><span>${lbl}</span></div>
      </div>
    </a>`;
  }).join('');
}

function filter(btn, f) {
  document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  currentFilter = f;
  render(f);
}

render('all');
</script>
</body>
</html>
